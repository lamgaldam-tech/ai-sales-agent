services:
  server:
    build:
      context: .
    ports:
      - "3000:3000"
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    gpus: all

volumes:
  ollama: